<html>
<head>
<title> Border Collapse </title>
<style>
h1 { font-size : 32px }
table { border : 3px solid blue ; border-collapse : separate }
th , td { border : 4px solid deeppink ; padding : 8px ; text-align : center ; font-size : 24px }
th { background : yellow }
td { background : cyan }
</style>
</head>
<body>
<h1>The border-collapse Property </h1>
<h2> border-collapse : separate ; </h2>
<table>
<tr><th>First_Name</th>
    <th>Last_Name</th>
    <th>Subject</th>
    <th>Marks</th></tr>

<tr><td> James </td>
    <td> Gosling </td>
    <td> Maths </td>
    <td> 92 </td> </tr>
<tr><td> Alan </td>
    <td> Rickman </td>
    <td> Maths </td>
    <td> 89 </td></tr>
<tr><td> Sam </td>
    <td> Mendes </td>
    <td> Maths </td>
    <td> 82 </td></tr>
</table>
</body>
</html>
